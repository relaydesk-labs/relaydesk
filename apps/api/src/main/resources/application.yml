spring:
  application:
    name: relaydesk-api
  datasource:
    url: jdbc:h2:mem:relaydesk;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: 8080

relaydesk:
  tenant-id: demo-company
